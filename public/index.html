<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodConnect Bharat — Surplus Food Rescue & Redistribution Network</title>
    <meta name="description"
        content="A map-first food redistribution platform connecting surplus food with beneficiaries, volunteers, NGOs, and community kitchens across India.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#f97316',
                            green: '#10b981',
                            darkgreen: '#059669',
                            red: '#ef4444',
                            amber: '#f59e0b',
                            blue: '#3b82f6',
                            purple: '#8b5cf6',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- TOP HEADER & BRAND BAR -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-3">

            <!-- LOGO & TAGLINE -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showTab('map-view')">
                <div
                    class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 via-orange-500 to-emerald-500 flex items-center justify-center text-white font-extrabold text-xl shadow-lg">
                    🍱
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-extrabold text-xl tracking-tight text-white">FoodConnect <span
                                class="text-amber-400">Bharat</span></span>
                    </div>
                    <p class="text-xs text-slate-300 font-medium hidden sm:block">Connect Food. Connect People. Reduce
                        Waste.</p>
                </div>
            </div>

            <!-- ROLE SELECTOR -->
            <div class="bg-slate-800/90 p-1 rounded-xl border border-slate-700/60 flex items-center space-x-1">
                <span class="text-xs text-slate-400 font-medium px-2 hidden md:inline">Role:</span>
                <button id="role-donor-btn" onclick="switchRole('DONOR')"
                    class="role-btn px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 bg-orange-500 text-white">
                    <span>🍱</span> <span class="hidden sm:inline">Donor</span>
                </button>
                <button id="role-beneficiary-btn" onclick="switchRole('BENEFICIARY')"
                    class="role-btn px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 text-slate-300 hover:text-white">
                    <span>🙏</span> <span class="hidden sm:inline">Beneficiary</span>
                </button>
                <button id="role-volunteer-btn" onclick="switchRole('VOLUNTEER')"
                    class="role-btn px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 text-slate-300 hover:text-white">
                    <span>🚴</span> <span class="hidden sm:inline">Volunteer</span>
                </button>
                <button id="role-ngo-btn" onclick="switchRole('NGO')"
                    class="role-btn px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 text-slate-300 hover:text-white">
                    <span>🏢</span> <span class="hidden sm:inline">NGO</span>
                </button>
                <button id="role-admin-btn" onclick="switchRole('ADMIN')"
                    class="role-btn px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1 text-slate-300 hover:text-white">
                    <span>🛡️</span> <span class="hidden sm:inline">Admin</span>
                </button>
            </div>

            <!-- NOTIFICATION BELL & ACTIONS -->
            <div class="flex items-center space-x-3 relative">
                <button id="notif-btn" onclick="toggleNotificationCenter(event)"
                    class="relative bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-200 border border-slate-700">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span id="notif-badge"
                        class="absolute -top-1 -right-1 bg-red-500 text-white font-extrabold text-[10px] w-4 h-4 rounded-full flex items-center justify-center">3</span>
                </button>

                <button onclick="openEmergencyRescueModal()"
                    class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center space-x-1 shadow animate-pulse">
                    <span>🚨</span>
                    <span class="font-extrabold">RESCUE FOOD</span>
                </button>
            </div>

        </div>
    </header>

    <!-- NOTIFICATION CENTER DROPDOWN / PANEL WITH CLOSE BUTTON -->
    <div id="notification-center"
        class="fixed top-16 right-4 sm:right-16 z-50 max-w-sm w-full bg-white rounded-3xl shadow-2xl border border-slate-200 p-4 hidden space-y-3">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <div class="flex items-center space-x-2">
                <i data-lucide="bell" class="w-4 h-4 text-orange-500"></i>
                <h3 class="font-extrabold text-slate-900 text-sm">Notifications</h3>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="clearNotifications()"
                    class="text-[11px] font-bold text-slate-400 hover:text-slate-600">Mark all read</button>
                <button onclick="closeNotificationCenter()"
                    class="text-slate-400 hover:text-slate-700 p-1 rounded-full hover:bg-slate-100 flex items-center justify-center"
                    title="Close notifications">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <div id="notification-list-container" class="space-y-2 max-h-80 overflow-y-auto pr-1 text-xs">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- NAVIGATION TABS -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-[61px] z-40">
        <div
            class="max-w-7xl mx-auto px-4 flex items-center space-x-1 overflow-x-auto py-2 text-xs sm:text-sm font-medium scrollbar-none">
            <button onclick="showTab('map-view')" id="tab-map-view"
                class="nav-tab text-orange-600 font-bold border-b-2 border-orange-500 px-3 py-1.5 whitespace-nowrap flex items-center space-x-1.5">
                <i data-lucide="map" class="w-4 h-4"></i> <span>Live Map</span>
            </button>
            <button onclick="showTab('rescue-missions')" id="tab-rescue-missions"
                class="nav-tab text-slate-600 hover:text-slate-900 px-3 py-1.5 whitespace-nowrap flex items-center space-x-1.5">
                <i data-lucide="siren" class="w-4 h-4 text-red-600"></i> <span>Rescue Missions</span>
            </button>
            <button onclick="showTab('delivery-batches')" id="tab-delivery-batches"
                class="nav-tab text-slate-600 hover:text-slate-900 px-3 py-1.5 whitespace-nowrap flex items-center space-x-1.5">
                <i data-lucide="boxes" class="w-4 h-4 text-amber-600"></i> <span>Multi-Stop Batches</span>
            </button>
            <button onclick="showTab('share-food')" id="tab-share-food"
                class="nav-tab text-slate-600 hover:text-slate-900 px-3 py-1.5 whitespace-nowrap flex items-center space-x-1.5">
                <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-600"></i> <span>Share Food (Donor)</span>
            </button>
            <button onclick="showTab('request-food')" id="tab-request-food"
                class="nav-tab text-slate-600 hover:text-slate-900 px-3 py-1.5 whitespace-nowrap flex items-center space-x-1.5">
                <i data-lucide="heart-handshake" class="w-4 h-4 text-red-500"></i> <span>Request Food
                    (Beneficiary)</span>
            </button>
            <button onclick="showTab('volunteer-tasks')" id="tab-volunteer-tasks"
                class="nav-tab text-slate-600 hover:text-slate-900 px-3 py-1.5 whitespace-nowrap flex items-center space-x-1.5">
                <i data-lucide="bike" class="w-4 h-4 text-teal-600"></i> <span>Volunteer Logistics</span>
            </button>
            <button onclick="showTab('ngo-ops')" id="tab-ngo-ops"
                class="nav-tab text-slate-600 hover:text-slate-900 px-3 py-1.5 whitespace-nowrap flex items-center space-x-1.5">
                <i data-lucide="building-2" class="w-4 h-4 text-purple-600"></i> <span>NGO Operations</span>
            </button>
            <button onclick="showTab('admin-panel')" id="tab-admin-panel"
                class="nav-tab text-slate-600 hover:text-slate-900 px-3 py-1.5 whitespace-nowrap flex items-center space-x-1.5">
                <i data-lucide="shield" class="w-4 h-4 text-indigo-600"></i> <span>Admin Command</span>
            </button>
            <button onclick="showTab('impact-dashboard')" id="tab-impact-dashboard"
                class="nav-tab text-slate-600 hover:text-slate-900 px-3 py-1.5 whitespace-nowrap flex items-center space-x-1.5">
                <i data-lucide="bar-chart-3" class="w-4 h-4 text-emerald-600"></i> <span>Impact Ledger</span>
            </button>
        </div>
    </nav>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-1 relative">

        <!-- 1. LIVE MAP VIEW -->
        <div id="view-map-view" class="tab-content block">

            <!-- MAP FILTER TOOLBAR -->
            <div
                class="bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-2.5 shadow-sm flex flex-wrap items-center justify-between gap-3 text-xs">
                <div class="flex flex-wrap items-center gap-1.5">
                    <span class="font-bold text-slate-500 uppercase tracking-wider text-[10px] mr-1">Show:</span>

                    <button onclick="toggleMapFilter('donations')" id="chip-donations"
                        class="filter-chip px-2.5 py-1 rounded-full font-semibold border border-emerald-500 bg-emerald-500 text-white flex items-center space-x-1">
                        <span class="w-2 h-2 rounded-full bg-white"></span> <span>Available Food</span>
                    </button>

                    <button onclick="toggleMapFilter('requests')" id="chip-requests"
                        class="filter-chip px-2.5 py-1 rounded-full font-semibold border border-red-500 bg-red-500 text-white flex items-center space-x-1">
                        <span class="w-2 h-2 rounded-full bg-white"></span> <span>Food Requests</span>
                    </button>

                    <button onclick="toggleMapFilter('bhandaras')" id="chip-bhandaras"
                        class="filter-chip px-2.5 py-1 rounded-full font-semibold border border-amber-500 bg-amber-500 text-white flex items-center space-x-1">
                        <span class="w-2 h-2 rounded-full bg-white"></span> <span>Bhandaras</span>
                    </button>

                    <button onclick="toggleMapFilter('kitchens')" id="chip-kitchens"
                        class="filter-chip px-2.5 py-1 rounded-full font-semibold border border-blue-500 bg-blue-500 text-white flex items-center space-x-1">
                        <span class="w-2 h-2 rounded-full bg-white"></span> <span>Kitchens</span>
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="startSimulatedRoute()"
                        class="bg-sky-600 hover:bg-sky-700 text-white font-extrabold px-3 py-1 rounded-lg border border-sky-400 flex items-center space-x-1 shadow">
                        <span>🚴</span> <span>Simulate Route Movement</span>
                    </button>

                    <select id="dietary-filter" onchange="applyDietaryFilter(this.value)"
                        class="bg-slate-100 border border-slate-300 text-slate-700 rounded-lg px-2.5 py-1 font-semibold text-xs">
                        <option value="ALL">All Dietary Preferences</option>
                        <option value="VEG">🟢 Veg Only</option>
                        <option value="JAIN">🟡 Jain Only (No Onion/Garlic)</option>
                        <option value="NON_VEG">🔴 Non-Veg Allowed</option>
                    </select>
                </div>
            </div>

            <div class="relative">
                <div id="main-map"></div>
            </div>
        </div>

        <!-- Share Food -->
        <div id="view-share-food" class="tab-content hidden p-4 sm:p-8 max-w-6xl mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 glass-card p-6 rounded-3xl border border-slate-200">
                    <h2 class="text-2xl font-extrabold text-slate-900 mb-4">🍱 Post Surplus Food</h2>

                    <form id="donor-form" onsubmit="handleFoodDonationSubmit(event)"
                        class="space-y-4 text-xs sm:text-sm">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">Donor Name *</label>
                                <input type="text" id="don-name" required placeholder="Jain Bhojanalaya / Ankit"
                                    class="w-full px-3 py-2 border rounded-xl">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">Donor Type *</label>
                                <select id="don-type" class="w-full px-3 py-2 border rounded-xl">
                                    <option value="Restaurant">Restaurant / Bhojanalaya</option>
                                    <option value="Wedding">Wedding / Banquet</option>
                                    <option value="Bhandara">Bhandara / Langar</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">Food Description *</label>
                                <input type="text" id="don-food-name" required
                                    placeholder="Pure Jain Dal Fry & Vegetable Khichdi"
                                    class="w-full px-3 py-2 border rounded-xl">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">Total Servings *</label>
                                <input type="number" id="don-servings" required placeholder="40"
                                    class="w-full px-3 py-2 border rounded-xl">
                            </div>
                        </div>

                        <button type="submit"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl">
                            Post Surplus Food On Map
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Request Food Tab -->
        <div id="view-request-food" class="tab-content hidden p-4 sm:p-8 max-w-6xl mx-auto">
            <div class="glass-card p-6 rounded-3xl border border-slate-200">
                <h2 class="text-2xl font-extrabold text-slate-900 mb-4">🙏 Request Food (Beneficiary)</h2>
                <form id="beneficiary-form" onsubmit="handleFoodRequestSubmit(event)" class="space-y-4">
                    <input type="text" id="req-name" required placeholder="Beneficiary Name"
                        class="w-full px-3 py-2 border rounded-xl">
                    <input type="number" id="req-people" required placeholder="10"
                        class="w-full px-3 py-2 border rounded-xl">
                    <select id="req-dietary" class="w-full px-3 py-2 border rounded-xl">
                        <option value="JAIN">🟡 Pure Jain Only</option>
                        <option value="VEG">🟢 Veg Only</option>
                    </select>
                    <input type="text" id="req-address" required placeholder="Karol Bagh, Delhi"
                        class="w-full px-3 py-2 border rounded-xl">
                    <button type="submit" class="w-full bg-red-600 text-white font-extrabold py-3 rounded-xl">Broadcast
                        Request On Map</button>
                </form>
            </div>
        </div>

        <!-- Volunteer Logistics Tab -->
        <div id="view-volunteer-tasks" class="tab-content hidden p-4 sm:p-8 max-w-6xl mx-auto">
            <div id="volunteer-tasks-container" class="space-y-4"></div>
        </div>

        <!-- NGO Operations Tab -->
        <div id="view-ngo-ops" class="tab-content hidden p-4 sm:p-8 max-w-6xl mx-auto">
            <div id="ngo-escalated-container" class="space-y-4"></div>
        </div>

        <!-- Rescue Missions Tab -->
        <div id="view-rescue-missions" class="tab-content hidden p-4 sm:p-8 max-w-6xl mx-auto">
            <div id="rescue-missions-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <!-- Multi-Stop Delivery Batches Tab -->
        <div id="view-delivery-batches" class="tab-content hidden p-4 sm:p-8 max-w-6xl mx-auto">
            <div id="delivery-batches-container" class="space-y-6"></div>
        </div>

        <!-- Admin Panel Tab -->
        <div id="view-admin-panel" class="tab-content hidden p-4 sm:p-8 max-w-6xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div id="admin-verification-queue" class="space-y-3"></div>
                <div id="admin-safety-reports" class="space-y-3"></div>
            </div>
        </div>

        <!-- Impact Dashboard Tab -->
        <div id="view-impact-dashboard" class="tab-content hidden p-4 sm:p-8 max-w-6xl mx-auto">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-emerald-50 p-6 rounded-3xl text-center border border-emerald-200">
                    <span class="block text-4xl font-extrabold text-emerald-700" id="impact-total-meals">1,840</span>
                    <span class="text-xs font-bold text-emerald-800">Meals Delivered</span>
                </div>
            </div>
        </div>

    </main>

    <!-- TOAST NOTIFICATIONS CONTAINER -->
    <div id="toast-container" class="flex flex-col gap-2"></div>

    <!-- App JS -->
    <script src="/app.js"></script>
</body>

</html>
